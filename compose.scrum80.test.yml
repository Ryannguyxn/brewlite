name: brewlite_scrum80_test

services:
  postgres:
    image: postgres:18-alpine
    restart: "no"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${SCRUM80_DB_PASSWORD:?Password required}
      POSTGRES_DB: brewlite_scrum80_verify
    ports:
      - "127.0.0.1:55480:5432"
    volumes:
      - scrum80_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d brewlite_scrum80_verify"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  scrum80_pgdata:
